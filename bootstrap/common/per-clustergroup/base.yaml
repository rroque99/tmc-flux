---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: clustergroup-gitops
  namespace: tanzu-continuousdelivery-resources
spec:
  interval: 1m0s
  force: true
  path: clustergroups/${clustergroup_name}
  components: 
    - ../../clusters/${cluster_name}/clustergroup-patches
  prune: true
  postBuild:
    substitute:
      clustergroup_name: ${clustergroup_name}
      cluster_name: ${cluster_name}
  sourceRef:
    kind: GitRepository
    namespace: tanzu-continuousdelivery-resources
    name: infra-gitops

---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: clustergroup1-gitops
  namespace: tanzu-continuousdelivery-resources
spec:
  interval: 1m0s
  force: true
  path: additionalgroups/${group1:=null}
  components: 
    - ../../clusters/${cluster_name}/clustergroup-patches
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: additionalgroups
        # Use this ConfigMap if it exists, but proceed if it doesn't.
        optional: true  
    substitute:
      clustergroup_name: ${clustergroup_name}
      cluster_name: ${cluster_name}
  sourceRef:
    kind: GitRepository
    namespace: tanzu-continuousdelivery-resources
    name: infra-gitops
